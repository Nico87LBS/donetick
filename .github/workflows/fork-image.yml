name: Fork image

# Builds this fork, with the matching frontend fork, into
# ghcr.io/<owner>/donetick so a self-hosted install can run it.

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch:
    inputs:
      frontend_ref:
        description: 'Frontend branch or tag to build'
        required: false
        default: 'develop'
        type: string

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout frontend fork
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/frontend
          ref: ${{ inputs.frontend_ref || 'develop' }}
          path: frontend-code

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build frontend
        run: |
          cd frontend-code
          npm ci
          npx vite build --mode selfhosted
          cd ..
          rm -rf ./frontend/dist
          cp -r frontend-code/dist ./frontend/dist

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        run: |
          IMAGE=ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/donetick
          SHA=$(git rev-parse --short HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$IMAGE:latest,$IMAGE:$SHA" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=fork-${{ steps.meta.outputs.sha }}
            COMMIT=${{ steps.meta.outputs.sha }}
